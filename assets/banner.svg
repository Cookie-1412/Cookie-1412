<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0026"/>
      <stop offset="0.28" stop-color="#2e0a63"/>
      <stop offset="0.5" stop-color="#6a1b9a"/>
      <stop offset="0.66" stop-color="#b8237f"/>
      <stop offset="0.8" stop-color="#ff4f4f"/>
      <stop offset="0.9" stop-color="#ff8a2a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.45" stop-color="#ffa133"/>
      <stop offset="1" stop-color="#ff3d77"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0650"/>
      <stop offset="1" stop-color="#0b001c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <mask id="sunCuts">
      <rect width="1200" height="360" fill="#fff"/>
      <rect x="0" y="214" width="1200" height="3" fill="#000"/>
      <rect x="0" y="226" width="1200" height="5" fill="#000"/>
      <rect x="0" y="240" width="1200" height="7" fill="#000"/>
      <rect x="0" y="256" width="1200" height="9" fill="#000"/>
    </mask>
    <clipPath id="aboveHorizon"><rect width="1200" height="272"/></clipPath>
    <clipPath id="belowHorizon"><rect y="272" width="1200" height="88"/></clipPath>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feFlood flood-color="#ff7a3c" flood-opacity="0.75"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="90" cy="40" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="95" r="1"/>
    <circle cx="330" cy="30" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="70" r="1"/>
    <circle cx="760" cy="28" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="85" r="1"/>
    <circle cx="1010" cy="45" r="1.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="100" r="1.1"/>
    <circle cx="150" cy="140" r="0.9" opacity="0.6"/>
    <circle cx="1060" cy="150" r="0.9" opacity="0.6"/>
  </g>

  <!-- sun -->
  <circle cx="600" cy="262" r="190" fill="url(#glow)"/>
  <g clip-path="url(#aboveHorizon)">
    <circle cx="600" cy="262" r="110" fill="url(#sun)" mask="url(#sunCuts)"/>
  </g>

  <!-- mountains -->
  <path d="M0 272 L0 214 L70 186 L140 222 L210 176 L300 236 L360 214 L430 272 Z" fill="#3a0b5e" opacity="0.9"/>
  <path d="M0 272 L0 238 L90 216 L170 248 L250 228 L330 272 Z" fill="#22053f"/>
  <path d="M1200 272 L1200 206 L1120 178 L1050 220 L980 184 L900 238 L840 218 L770 272 Z" fill="#3a0b5e" opacity="0.9"/>
  <path d="M1200 272 L1200 236 L1110 214 L1030 246 L950 228 L870 272 Z" fill="#22053f"/>

  <!-- ground and grid -->
  <rect y="272" width="1200" height="88" fill="url(#ground)"/>
  <line x1="0" y1="272" x2="1200" y2="272" stroke="#ff8a3c" stroke-width="2"/>
  <g clip-path="url(#belowHorizon)" stroke="#c04dff" stroke-opacity="0.55" stroke-width="1.2">
    <g>
      <line x1="0" y1="280" x2="1200" y2="280"/>
      <line x1="0" y1="292" x2="1200" y2="292"/>
      <line x1="0" y1="310" x2="1200" y2="310"/>
      <line x1="0" y1="336" x2="1200" y2="336"/>
      <line x1="0" y1="372" x2="1200" y2="372"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="6s" repeatCount="indefinite"/>
    </g>
    <line x1="600" y1="272" x2="600" y2="360"/>
    <line x1="600" y1="272" x2="480" y2="360"/>
    <line x1="600" y1="272" x2="720" y2="360"/>
    <line x1="600" y1="272" x2="340" y2="360"/>
    <line x1="600" y1="272" x2="860" y2="360"/>
    <line x1="600" y1="272" x2="160" y2="360"/>
    <line x1="600" y1="272" x2="1040" y2="360"/>
    <line x1="600" y1="272" x2="-60" y2="360"/>
    <line x1="600" y1="272" x2="1260" y2="360"/>
    <line x1="600" y1="272" x2="-340" y2="360"/>
    <line x1="600" y1="272" x2="1540" y2="360"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="92" font-size="58" font-weight="800" fill="#fff4e6" letter-spacing="3" filter="url(#textGlow)">ALBERT JONATHAN</text>
    <text x="600" y="132" font-size="20" font-weight="500" fill="#ffd2a8" letter-spacing="5">AI · GAME ENGINES · SELF-PLAY</text>
  </g>
</svg>
